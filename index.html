<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثيم تفاعلي لـ روري</title>
    <style>
        /* القياسات الجديدة مالت المود لتوسيط الكارد وجعله ممتازاً على الموبايل */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #2c1a30; /* الخلفية الداكنة الأصلية مالتك */
            color: white; 
            text-align: center; 
            padding: 50px 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
            margin: 0;
        }
        .card { 
            background: #3d2444; /* لون الكارد الداكن مالتك */
            padding: 30px 20px; 
            border-radius: 15px; 
            width: 100%;
            max-width: 400px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        h2 {
            font-size: 22px;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        button { 
            background: #ff007f; /* الحفاظ على لون أزرارك الوردي المميز */
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 25px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.3s ease;
        }
        button:hover { 
            background: #e00070; 
        }
    </style>
</head>
<body>

<audio id="bg-music" loop>
    <source src="./music.mp3" type="audio/mpeg">
    متصفحك لا يدعم تشغيل الصوت.
</audio>

<div class="card">
    <h2 id="text-box">هلو روري 🥰<br>تعالي عندي سوالف وياج </h2>
    
    <div id="button-area">
        <button onclick="startTheme()">شنو ؟👀</button>
    </div>
</div>

<script>
function startTheme() {
    const music = document.getElementById('bg-music');
    // تشغيل الموسيقى مع أول ضغطة
    music.play().catch(error => {
        console.log("المتصفح يطلب تفاعل لتشغيل الصوت، الكود يعمل طبيعي.");
    });
    nextStep(1);
}

function nextStep(stepNumber) {
    const textBox = document.getElementById('text-box');
    const buttonArea = document.getElementById('button-area');

    if(stepNumber === 1) {
        textBox.innerText = "سمعت إنوعيونج تلمع من تشوفين شخص معين؟ 😉";
        buttonArea.innerHTML = '<button onclick="nextStep(2)">مو صحيح 🙈</button>';
    }
    else if(stepNumber === 2) {
        textBox.innerText = "هااا؟ يعني اكو شخص!كوليلي إني ما أكول لأحد 🤫";
        buttonArea.innerHTML = '<button onclick="nextStep(3)">ماكو أحد 🙄</button>';
    } 
    else if(stepNumber === 3) {
        textBox.innerText = "إذا ماكو أحد... ليش تبتسمين هسة ❤️";
        buttonArea.innerHTML = '<button onclick="nextStep(4)">صدفة 🤷‍♀️</button>';
    }
    else if(stepNumber === 4) {
        textBox.innerText = "شنو صدفة؟ احجيلي الصدك...لان هو كالي الشعور الي يحسة من يشوفج ماكو شي بلدنيا يشبهه ❤️";
        buttonArea.innerHTML = '<button onclick="nextStep(5)">مدري خليني شوف 🤣</button>';
    }
    else if(stepNumber === 5) {
        textBox.innerText = "يلا ماشي رح اغلس هسة 😏";
        buttonArea.innerHTML = '<button onclick="alert(\'💖Bütün İstanbul Biliyo🍀\')">❤️ اضغطي هنا علمود يخلص الشات</button>';
    }
}
</script>

</body>
</html>
